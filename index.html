<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Tetris Three.js</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0a1a;
        overflow: hidden;
        font-family: 'Courier New', monospace;
        color: #fff;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        width: 100vw;
        height: 100vh;
        position: relative;
        touch-action: none;
      }
      canvas { display: block; }

      /* ── HUD ── */
      #hud {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        pointer-events: none;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #hud-right {
        position: absolute;
        right: calc(50% - 320px);
        top: 50%;
        transform: translateY(-50%);
        text-align: left;
        text-shadow: 0 0 10px rgba(255,255,255,0.5);
      }

      #hud-left {
        position: absolute;
        left: calc(50% - 320px);
        top: 50%;
        transform: translateY(-50%) translateX(-100%);
        text-align: right;
        text-shadow: 0 0 10px rgba(255,255,255,0.5);
      }

      #hud-right .label, #hud-left .label {
        font-size: 12px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 2px;
      }

      #hud-right .value {
        font-size: 24px;
        margin-bottom: 16px;
        color: #fff;
        text-shadow: 0 0 15px rgba(0,255,255,0.6);
      }

      #next-preview {
        width: 100px;
        height: 80px;
        margin-bottom: 16px;
      }

      #hold-preview {
        width: 100px;
        height: 80px;
        margin-bottom: 4px;
        display: block;
        margin-left: auto;
        transition: opacity 0.15s;
      }

      /* ── Overlay ── */
      #overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(10, 10, 26, 0.85);
        pointer-events: auto;
        z-index: 10;
      }

      #overlay.hidden { display: none; }

      #overlay h1 {
        font-size: 48px;
        text-shadow: 0 0 30px #ff00ff, 0 0 60px #ff00ff;
        color: #ff00ff;
        margin-bottom: 20px;
      }

      #overlay .subtitle {
        font-size: 16px;
        color: #00ffff;
        text-shadow: 0 0 15px #00ffff;
        animation: pulse 1.5s ease-in-out infinite;
      }

      #overlay .score-display {
        font-size: 32px;
        color: #ffff00;
        text-shadow: 0 0 20px #ffff00;
        margin-bottom: 10px;
      }

      #overlay .best-score {
        font-size: 18px;
        color: #00ff88;
        text-shadow: 0 0 12px #00ff88;
        margin-bottom: 16px;
      }

      #overlay .history-table {
        margin-top: 12px;
        font-size: 13px;
        color: #aaa;
        text-align: left;
      }

      #overlay .history-table .header {
        color: #888;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      #overlay .history-table .row {
        margin-top: 4px;
      }

      #overlay .history-table .rank {
        color: #ff00ff;
        display: inline-block;
        width: 24px;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      /* ── Settings ── */
      #settings-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid rgba(100, 100, 200, 0.5);
        background: rgba(20, 20, 50, 0.6);
        color: #aaccff;
        font-size: 20px;
        cursor: pointer;
        pointer-events: auto;
        z-index: 25;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s, border-color 0.15s;
      }

      #settings-btn:hover, #settings-btn:active {
        background: rgba(80, 80, 180, 0.4);
        border-color: #00ffff;
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
      }

      #settings-panel {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(15, 15, 35, 0.97);
        border: 2px solid #4444aa;
        border-radius: 12px;
        padding: 24px 32px;
        z-index: 100;
        min-width: 280px;
        box-shadow: 0 0 40px rgba(0, 255, 255, 0.2), 0 0 80px rgba(255, 0, 255, 0.1);
      }

      #settings-panel.hidden {
        display: none;
      }

      #settings-panel h2 {
        margin: 0 0 20px 0;
        font-size: 24px;
        color: #ff00ff;
        text-shadow: 0 0 15px #ff00ff;
        text-align: center;
        letter-spacing: 3px;
      }

      #settings-panel label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        font-size: 14px;
        color: #ccc;
      }

      #settings-panel input[type="range"] {
        width: 120px;
        accent-color: #00ffff;
        cursor: pointer;
      }

      #settings-panel input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #00ffff;
        cursor: pointer;
      }

      #settings-panel select {
        padding: 6px 10px;
        font-family: inherit;
        font-size: 12px;
        background: rgba(20, 20, 50, 0.8);
        border: 1px solid #4444aa;
        border-radius: 4px;
        color: #00ffff;
        cursor: pointer;
      }

      #settings-panel select:focus {
        outline: none;
        border-color: #00ffff;
      }

      #settings-panel .setting-value {
        min-width: 36px;
        text-align: right;
        color: #00ffff;
        font-size: 12px;
      }

      #settings-panel .section-label {
        font-size: 11px;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin: 18px 0 10px 0;
        padding-top: 10px;
        border-top: 1px solid #333;
      }

      #settings-panel .section-label:first-of-type {
        margin-top: 0;
        padding-top: 0;
        border-top: none;
      }

      #settings-close {
        width: 100%;
        margin-top: 20px;
        padding: 10px 20px;
        font-family: inherit;
        font-size: 14px;
        border: 2px solid #4444aa;
        border-radius: 6px;
        background: rgba(20, 20, 50, 0.8);
        color: #00ffff;
        cursor: pointer;
        transition: all 0.15s;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      #settings-close:hover {
        background: rgba(0, 255, 255, 0.15);
        border-color: #00ffff;
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
      }

      #settings-backdrop {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 99;
      }

      #settings-backdrop.hidden {
        display: none;
      }

      /* ── Score Popups ── */
      #popups {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        pointer-events: none;
        z-index: 15;
        overflow: hidden;
      }

      .popup {
        position: absolute;
        left: 50%;
        top: 45%;
        transform: translate(-50%, -50%);
        font-family: 'Courier New', monospace;
        font-weight: bold;
        white-space: nowrap;
        letter-spacing: 2px;
        animation: popup-rise 1.1s ease-out forwards;
      }

      @keyframes popup-rise {
        0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
        18%  { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
        35%  { transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -180%) scale(0.95); }
      }

      /* ── Touch Controls ── */
      #touch-controls {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0; right: 0;
        padding: 12px 16px;
        padding-bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 20;
        pointer-events: auto;
        justify-content: space-between;
        align-items: flex-end;
      }

      .touch-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .touch-row {
        display: flex;
        gap: 10px;
      }

      .touch-btn {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 2px solid rgba(100, 100, 200, 0.5);
        background: rgba(20, 20, 50, 0.6);
        color: #aaccff;
        font-size: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: background 0.1s, border-color 0.1s;
      }

      .touch-btn:active {
        background: rgba(80, 80, 180, 0.4);
        border-color: #00ffff;
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
      }

      .touch-btn.small {
        width: 44px;
        height: 44px;
        font-size: 16px;
      }

      /* Show touch controls on touch devices */
      @media (pointer: coarse) {
        #touch-controls { display: flex; }
      }

      /* Mobile HUD adjustments */
      @media (max-width: 700px) {
        #hud-right {
          right: 8px;
          top: 8px;
          transform: none;
          text-align: right;
        }
        #hud-left {
          left: 8px;
          top: 8px;
          transform: none;
          text-align: left;
        }
        #hud-right .value { font-size: 18px; margin-bottom: 8px; }
        #hud-right .label, #hud-left .label { font-size: 10px; }
        #next-preview { width: 60px; height: 50px; margin-bottom: 8px; }
        #hold-preview { width: 60px; height: 50px; margin-left: 0; }
        #overlay h1 { font-size: 32px; }
        #overlay .score-display { font-size: 24px; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Settings Button -->
      <button id="settings-btn" title="Settings">&#9881;</button>

      <!-- Settings Backdrop -->
      <div id="settings-backdrop" class="hidden"></div>

      <!-- Settings Panel -->
      <div id="settings-panel" class="hidden">
        <h2>Settings</h2>

        <div class="section-label">Audio</div>
        <label>
          Music
          <input type="range" id="set-music" min="0" max="100" value="50">
          <span class="setting-value" id="set-music-val">50%</span>
        </label>
        <label>
          SFX
          <input type="range" id="set-sfx" min="0" max="100" value="70">
          <span class="setting-value" id="set-sfx-val">70%</span>
        </label>

        <div class="section-label">Controls</div>
        <label>
          DAS Delay
          <input type="range" id="set-das-delay" min="50" max="300" step="10" value="170">
          <span class="setting-value" id="set-das-delay-val">170ms</span>
        </label>
        <label>
          DAS Rate
          <input type="range" id="set-das-rate" min="10" max="100" step="5" value="50">
          <span class="setting-value" id="set-das-rate-val">50ms</span>
        </label>

        <div class="section-label">Theme</div>
        <label>
          Style
          <select id="set-theme">
            <option value="neon">Neon</option>
            <option value="gameboy-dark">Retro Dark</option>
            <option value="gameboy-light">Retro Light</option>
          </select>
        </label>

        <div class="section-label">Effects</div>
        <label>
          Screen Shake
          <input type="checkbox" id="set-shake" checked>
        </label>
        <label>
          Bloom Effect
          <input type="checkbox" id="set-bloom" checked>
        </label>

        <button id="settings-close">Close</button>
      </div>

      <div id="hud">
        <div id="hud-left">
          <div class="label">Hold</div>
          <canvas id="hold-preview"></canvas>
        </div>
        <div id="hud-right">
          <div class="label">Next</div>
          <canvas id="next-preview"></canvas>
          <div class="label">Score</div>
          <div class="value" id="score">0</div>
          <div class="label">Level</div>
          <div class="value" id="level">1</div>
          <div class="label">Lines</div>
          <div class="value" id="lines">0</div>
        </div>
      </div>
      <div id="popups"></div>
      <div id="overlay">
        <h1>MR. TET</h1>
        <div class="subtitle">Press ENTER to play</div>
      </div>

      <!-- Touch controls (hidden on desktop) -->
      <div id="touch-controls">
        <div class="touch-group">
          <div class="touch-row">
            <button class="touch-btn small" id="btn-hold">H</button>
            <button class="touch-btn small" id="btn-rotate-ccw">↺</button>
          </div>
          <div class="touch-row">
            <button class="touch-btn" id="btn-left">◀</button>
            <button class="touch-btn" id="btn-right">▶</button>
          </div>
        </div>
        <div class="touch-group">
          <button class="touch-btn small" id="btn-pause">⏸</button>
        </div>
        <div class="touch-group">
          <div class="touch-row">
            <button class="touch-btn small" id="btn-rotate-cw">↻</button>
          </div>
          <div class="touch-row">
            <button class="touch-btn" id="btn-soft-drop">▼</button>
            <button class="touch-btn" id="btn-hard-drop">⏬</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
